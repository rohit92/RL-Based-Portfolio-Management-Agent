# PPO Hyperparameters
learning_rate: 0.0003
n_steps: 2048
batch_size: 64
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
total_timesteps: 500000
eval_freq: 10000
policy_hidden_layers: [256, 256]

# Environment
lookback_window: 20
initial_portfolio_value: 10000
transaction_cost: 0.001
invalid_action_penalty: 0.001
volatility_penalty_weight: 0.1
action_hold: 0
action_buy: 1
action_sell: 2
n_actions: 3
position_flat: 0
position_long: 1
portfolio_state_size: 2

# Data
ticker: "AAPL"
tickers: ["AAPL", "MSFT", "GOOGL"]
download_start: "2010-01-01"
download_end: "2023-12-31"
train_start: "2010-01-01"
train_end: "2020-12-31"
val_start: "2021-01-01"
val_end: "2022-12-31"
test_start: "2023-01-01"
test_end: "2023-12-31"
rolling_vol_window: 5
ma_windows: [10, 20]

# Evaluation and outputs
checkpoint_dir: "checkpoints"
results_dir: "results"
runs_dir: "runs"
best_model_name: "ppo_best.zip"
final_model_name: "ppo_final.zip"
training_curve_name: "training_curve.png"
equity_curve_name: "equity_curves.png"
action_distribution_name: "ppo_action_distribution.png"

# Metrics
risk_free_rate: 0.0
periods_per_year: 252

# Reproducibility
seed: 42
